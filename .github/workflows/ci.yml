name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install ffmpeg (render tests run the real pipeline)
        run: sudo apt-get update -q && sudo apt-get install -y -q ffmpeg
      - run: npm ci
      - run: npm run lint
      - run: npm test
