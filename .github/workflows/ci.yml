name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install ffmpeg (render tests run the real pipeline)
        run: sudo apt-get update -q && sudo apt-get install -y -q ffmpeg
      - run: npm ci
      - name: Install Chromium (browser UI tests)
        run: npx playwright-core install --with-deps chromium
      - run: npm run lint
      - run: npm test
      - name: Production build (catches bad dynamic imports and Node modules in workflow code)
        run: npm run build
